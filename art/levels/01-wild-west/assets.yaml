# Рівень 1 — Дикий Захід: що генеруємо і як.
#
# Конвеєр: tools/assets/level.py 01 --step refs → meshy → clean (див. README у tools/assets).
# Кроп — прямокутник [x0, y0, x1, y1] у пікселях концепту (1672×941).
# Методи: M — Meshy multi-image (meshy-7.1, 3 види), S — Meshy Smart Topology (meshy-t2.5, 1 вид),
#         G — процедурно в Godot (FLUX дає лише текстуру), 2D — картинка FLUX у Godot.
# size — розмір у метрах уздовж fit (longest | height | width); pivot — center (кидані) або bottom (статичні).
# collision — none (кидані: колізію будує throwable.gd), convex, mesh.
# rotate — поворот сирої моделі Meshy в градусах (X, Y, Z Blender), щоб «перед» дивився на гравця.

level: "01"
title: Дикий Захід
concepts:
  "01": art/concepts/01-wild-west.png
  "02": art/concepts/02-county-fair.png

# Спільний рядок стилю для всіх 5 рівнів. Контури в текстуру не малюємо — їх дає шейдер у Godot.
style: >-
  Same art style as the reference concept art: chunky, exaggerated cartoon shapes with rounded,
  rubbery proportions, combined with photorealistic PBR textures — real scratched metal, worn wood grain,
  cracked bone, aged leather. Warm golden-hour palette.

# Для 3D-рефів: один предмет, чистий фон — так Meshy краще відділяє форму.
ref_rules: >-
  Game asset reference sheet image: a single isolated object, fully visible and centered with margin,
  plain seamless light grey studio background, soft even studio lighting, no cast shadows, no outlines,
  no text, no motion blur, no smoke, no sparks, no other objects.

views:
  front34: three-quarter front view, camera slightly above
  front: straight front view, camera at the object's mid height, orthographic feel
  side: exact side view (right profile), orthographic feel
  back: straight back view, orthographic feel

refs:
  model: black-forest-labs/flux-3-image
  resolution: 1.5K
  aspect_ratio: "1:1"

meshy:
  M:
    endpoint: multi-image-to-3d
    views: [front, side, back]
    body:
      ai_model: latest
      should_remesh: true
      topology: triangle
      should_texture: true
      enable_pbr: true
      texture_resolution: 2k
      image_enhancement: false
      target_formats: [glb]
      multi_view_thumbnails: true
  S:
    endpoint: image-to-3d
    views: [front34]
    body:
      model_type: smart-topology
      ai_model: meshy-t2.5
      should_texture: true
      enable_pbr: true
      target_formats: [glb]
      multi_view_thumbnails: true

assets:
